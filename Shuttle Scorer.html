<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shuttle Scorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: court-green header band with tabs, then a single working column of cards (groups grid, bracket rows, setup form). */
:root{
  --bg:#fdf9f5; --surface:#ffffff; --ink:#3a2519; --muted:#86695a; --line:#f0e2d6; --chip:#fbf0e6;
  --court:#fbd6b8; --court-deep:#f7c19b; --court-ink:#4a2a18; --court-line:rgba(120,60,20,.14);
  --accent:#cf5d56; --shuttle:#f5dc80; --band-soft:rgba(120,60,20,.10);
  --gold:#d1a93a; --silver:#9aa5af; --bronze:#c2825a;
  --done-bg:#e8f4ea; --done-ink:#2f6b45; --court-bg:#e6effa; --court-ink2:#3d6aa8; --bad:#b8433a; --bad-bg:#fcebe8; --warn-bg:#fdf5d6; --win:#3a2519;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1411; --surface:#231b16; --ink:#f4e8e0; --muted:#b7a091; --line:#3a2e26; --chip:#2b211b;
  --court:#4a3326; --court-deep:#3c281d; --court-ink:#fde6d4; --court-line:rgba(255,220,190,.12);
  --accent:#ee968d; --shuttle:#e3cf7f; --band-soft:rgba(255,230,210,.10);
  --gold:#dcbd5e; --silver:#aeb8c1; --bronze:#d39a74;
  --done-bg:#1f2e24; --done-ink:#9fd3b0; --court-bg:#1c2636; --court-ink2:#8fb4e6; --bad:#f09a90; --bad-bg:#3b221e; --warn-bg:#36301a; --win:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1411; --surface:#231b16; --ink:#f4e8e0; --muted:#b7a091; --line:#3a2e26; --chip:#2b211b;
  --court:#4a3326; --court-deep:#3c281d; --court-ink:#fde6d4; --court-line:rgba(255,220,190,.12);
  --accent:#ee968d; --shuttle:#e3cf7f; --band-soft:rgba(255,230,210,.10);
  --gold:#dcbd5e; --silver:#aeb8c1; --bronze:#d39a74;
  --done-bg:#1f2e24; --done-ink:#9fd3b0; --court-bg:#1c2636; --court-ink2:#8fb4e6; --bad:#f09a90; --bad-bg:#3b221e; --warn-bg:#36301a; --win:#ffffff; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--shuttle);outline-offset:2px}

/* Header band: court lines drawn with borders */
.band{background:var(--court);color:var(--court-ink);position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-40px;top:14px;width:300px;height:180px;border:2px solid var(--court-line);border-right:0;pointer-events:none}
.band::before{content:"";position:absolute;right:-40px;top:58px;width:220px;height:92px;border:2px solid var(--court-line);border-right:0;pointer-events:none}
.band .wrap{position:relative;z-index:1;padding-block:18px 0}
.band{background:linear-gradient(135deg,var(--court) 0%,var(--court-deep) 100%)}
.band .tabs{border-top:1px solid var(--band-soft);padding-top:6px}
.club{display:flex;align-items:center;gap:14px}
.logo{width:76px;height:76px;flex:none;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--shuttle),0 4px 14px rgba(120,60,20,.15)}
.clubtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.clubname{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.6vw,28px);letter-spacing:.06em;text-transform:uppercase;line-height:1.05;}
@media (max-width:520px){.logo{width:58px;height:58px}}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{background:var(--shuttle);color:#2a1610;border-radius:3px;padding:1px 7px;font-weight:600;letter-spacing:.06em}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,6vw,46px);line-height:1;margin:16px 0 10px;text-wrap:balance;letter-spacing:.01em}
.rules{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;opacity:.95}
.rules b{font-weight:600}
.progress{margin-top:12px;height:4px;background:var(--band-soft);border-radius:2px;overflow:hidden;max-width:420px}
.progress i{display:block;height:100%;background:var(--accent);opacity:.75}
.tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto}
.tabs button{background:transparent;border:0;color:var(--court-ink);opacity:.7;padding:10px 16px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1}

main{padding-block:22px 36px;display:flex;flex-direction:column;gap:22px}
h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:.02em}
h3{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.banner{border-radius:8px;padding:10px 14px;background:var(--warn-bg);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Up next */
.next{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.next button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.next button:hover{border-color:var(--accent)}
.next small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Groups */
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.ghead h2{font-size:28px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
th.l,td.l{text-align:left}
td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.rank{width:28px;text-align:center;font-family:var(--display);font-weight:700;font-size:17px;border-left:4px solid transparent}
td.team{font-weight:500;max-width:200px}
.q-gold td.rank,.q-main td.rank{border-left-color:var(--gold)}
.q-main td.rank{border-left-color:var(--accent)}
.q-silver td.rank{border-left-color:var(--silver)}
.q-bronze td.rank{border-left-color:var(--bronze)}
.note{font-size:11px;color:var(--muted);margin-left:4px;letter-spacing:.04em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.fixtures{margin-top:14px;display:flex;flex-direction:column;gap:4px}
.fx{display:grid;grid-template-columns:34px minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 8px;cursor:pointer;text-align:left}
.fx:hover{background:var(--chip);border-color:var(--line)}
.fx .rd{font-size:11px;color:var(--muted);letter-spacing:.06em}
.fx .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.fx .t.b{text-align:right}
.fx .t.w{color:var(--win);font-weight:600}
.fx .sc{font-variant-numeric:tabular-nums;font-weight:600;min-width:64px;text-align:center;font-size:14px}
.fx .sc.none{color:var(--muted);font-weight:400}
.pill{font-size:11px;padding:1px 7px;border-radius:9px;font-weight:600;letter-spacing:.04em}
.pill.live{background:var(--warn-bg)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}

/* Knockout */
.bracket-card{border-top:5px solid var(--accent)}
.bracket-card.gold{border-top-color:var(--gold)}
.bracket-card.silver{border-top-color:var(--silver)}
.bracket-card.bronze{border-top-color:var(--bronze)}
.bracket{display:flex;gap:18px;overflow-x:auto;padding-bottom:6px;margin-top:14px}
.round{display:flex;flex-direction:column;gap:8px;min-width:230px;flex:1}
.rmatches{flex:1;display:flex;flex-direction:column}
.slot{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:6px}
.round h3{margin-bottom:2px}
.km{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0;text-align:left;cursor:pointer;width:100%;display:block}
.km:disabled{cursor:default}
.km:not(:disabled):hover{border-color:var(--accent)}
.km .code{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;color:var(--muted);padding:6px 10px 0}
.km .side{display:flex;align-items:center;gap:8px;padding:6px 10px}
.km .side + .side{border-top:1px dashed var(--line)}
.km .seed{font-size:11px;color:var(--muted);width:22px;flex:none}
.km .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.km .nm.w{color:var(--win);font-weight:600}
.km .nm.tbd{font-style:italic}
.km .gs{display:flex;gap:6px;font-variant-numeric:tabular-nums;font-size:13.5px}
.km .gs span{width:22px;text-align:right;color:var(--muted)}
.km .gs span.w{color:var(--win);font-weight:600}
.champ{font-family:var(--display);font-size:20px;font-weight:700}
.qlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin-top:10px}
.qlist ol{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.qlist li{display:flex;gap:8px}
.qlist li b{width:26px;color:var(--muted);font-weight:600}

/* Setup */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13.5px}
label.f small{font-weight:400;color:var(--muted)}
.f input,.f select,.f textarea,.rulegrid input,.rulegrid select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:240px;resize:vertical;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-direction:column;gap:8px}
.seg label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:400}
.seg label:has(input:checked){border-color:var(--accent);background:var(--chip)}
.seg b{display:block}
.rulegrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:8px 10px;align-items:center;font-size:13.5px}
.rulegrid .h{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.preview{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:14px}
.err{color:var(--bad);font-size:13.5px}
@supports (grid-template-rows:subgrid){
  .groups>section.card{display:grid;grid-template-rows:subgrid;grid-row:span 4;row-gap:0;align-content:start}
  .groups>section.card>*{align-self:start}
}

body.tvmode .sitefoot{padding-block:6px 8px;border-top:0}
#tv{padding-block:12px 8px;gap:12px}
#tv .tvside{overflow:hidden;-webkit-mask-image:linear-gradient(#000 calc(100% - 40px),transparent);mask-image:linear-gradient(#000 calc(100% - 40px),transparent)}
.tvko{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,620px),1fr));gap:18px;min-width:0;align-items:start}
#tv .km .code{font-size:.72em;padding:.5em .8em 0}
#tv .km .side{padding:.45em .8em;gap:.6em}
#tv .km .seed{font-size:.72em;width:2em}
#tv .km .nm{font-size:1.08em;white-space:normal;overflow:visible;line-height:1.15}
#tv .km .gs{font-size:1.15em;gap:.5em}
#tv .km .gs span{width:auto;min-width:1.5em}
#tv .km .side .trophy{width:1.2em;height:1.2em}
#tv .round h3{font-size:.8em}
#tv .champ{font-size:1.5em}
#tv .runner{font-size:1.2em}
#tv .tvres b{font-size:1.12em}

.sitefoot{padding-block:18px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;text-align:center;max-width:none}
@media print{.sitefoot{display:none}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.tile b small{font-size:18px;color:var(--muted);font-weight:600}
.tile span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px;align-items:start}
.recs li{display:flex;flex-direction:column;gap:1px}
.recs li span:first-of-type{font-weight:600}

.courts-closed{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--line);border-radius:10px;padding:12px 14px;background:var(--chip);color:var(--muted);opacity:.85}
.courts-closed div{display:flex;flex-direction:column;gap:2px}.courts-closed b{color:var(--ink);font-weight:600}

.dur{font-size:11.5px;font-weight:400;color:var(--muted);white-space:nowrap}
.planner{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.planner .row{align-items:flex-end}.planner label.f{flex:1;min-width:120px}
.planner input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;width:100%}
.plout{margin:0;font-size:15px}

.rest{font-style:normal;font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap}
.rest.tired{color:var(--bad)}.rest.busy{color:var(--court-ink2)}
.sgrid .hd .rest{font-size:11.5px}
.pick{margin-top:6px;font-size:13.5px}.pick summary{cursor:pointer;color:var(--muted)}
.pick select{width:100%;margin:6px 0;max-width:100%}

.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.court{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface);min-width:0}
.court.busy{background:var(--court-bg);border-color:color-mix(in srgb,var(--court-ink2) 35%,var(--line))}
.court.free{border-style:dashed}
.court .cn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.court.free .cn{font-weight:400;color:var(--muted)}
.court .btn{margin-top:6px;align-self:flex-start}
.since{font-variant-numeric:tabular-nums;font-weight:600;color:var(--court-ink2)}
.fx.oncourt,.km.oncourt{background:var(--court-bg)}
.pill.court{background:var(--court-ink2);color:var(--surface)}

.thirdrow{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:flex;gap:18px;overflow-x:auto}
.chk{display:inline-flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.trophy.bronze{color:var(--bronze)}

.km.done{background:var(--done-bg);border-color:color-mix(in srgb,var(--done-ink) 30%,var(--line))}
.km.live{background:var(--warn-bg)}
.km .side .trophy{width:18px;height:18px}
.trophy{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em}
.trophy.gold{color:var(--gold)}.trophy.silver{color:var(--silver)}
.podium{display:flex;gap:6px 20px;flex-wrap:wrap;align-items:center}
.podium .champ{display:inline-flex;gap:6px;align-items:center}
.runner{display:inline-flex;gap:6px;align-items:center;font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted)}

.pdfsel{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px}
.mg{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mrow input{flex:1;min-width:160px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px}
.mrow input:disabled{text-decoration:line-through;opacity:.6}
.mrow.add{border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}

#sheets{max-width:none;padding-block:18px 40px}
.sheetbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:297mm;margin:0 auto 14px}
.sheetbar a.btn{text-decoration:none;color:var(--ink)}
.sheetbar select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px}
.pages{overflow-x:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:8px}
.paper{background:#fff;color:#000;width:297mm;height:210mm;flex:none;margin:0 auto;padding:10mm;box-shadow:0 4px 24px rgba(0,0,0,.12);font-family:Calibri,Carlito,var(--body);display:flex;flex-direction:column;overflow:hidden}
.paperhead{display:flex;justify-content:space-between;gap:12px;border-bottom:1.2px solid #000;padding-bottom:1.5mm;margin-bottom:3mm;font-size:10pt;flex:none}
.sheetgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(6,auto);grid-auto-flow:row;gap:3mm 12mm;align-content:start}
.slip{break-inside:avoid;page-break-inside:avoid;min-width:0}
.slipmeta{font-size:8pt;color:#444;margin-bottom:.6mm;line-height:1.2}
.slip table{width:100%;border-collapse:collapse;table-layout:fixed}
.slip th,.slip td{border:1px solid #000;padding:0 2mm;height:7.4mm;text-align:left;color:#000;font-size:12.5pt;line-height:1.1;text-transform:none;letter-spacing:0}
.slip th{background:#d9d9d9;font-weight:700}
.slip .pn{width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff!important}
  :root{padding:0!important}
  body::before,.noprint{display:none!important}
  #sheets{padding:0!important;margin:0}
  .pages{display:block;overflow:visible;padding:0}
  .paper{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .paper:last-child{break-after:auto;page-break-after:auto}
  .slip th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.bkpick{flex-direction:row;flex-wrap:wrap;margin-bottom:6px}.bkpick label{flex:1;min-width:200px}.bkpick small{display:block}
.fx.done{background:var(--done-bg)}.fx.done .rd{color:var(--done-ink);font-weight:600}
.fx.live{background:var(--warn-bg)}
.fx.invalid{background:var(--bad-bg)}
.fx.void{opacity:.5;cursor:default}.fx.void .t{text-decoration:line-through}.fx.void:hover{background:transparent;border-color:transparent}
tr.wd td{color:var(--muted)}tr.wd td.team{text-decoration:line-through}
.wdbox{margin-top:14px;font-size:13.5px;border-top:1px dashed var(--line);padding-top:10px}
.wdbox summary{cursor:pointer;color:var(--muted)}
.wdbox select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;max-width:100%;min-width:0}
.wo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:12px}

.tabrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.tabrow .tabs{margin-top:0}
.tvlink{color:var(--court-ink);font-weight:600;text-decoration:none;background:var(--band-soft);padding:6px 14px;border-radius:999px;margin-bottom:8px;white-space:nowrap;font-size:14px}
.tvlink:hover{text-decoration:underline}
#tv{max-width:none;padding-block:18px 24px;display:flex;flex-direction:column;gap:18px;font-size:clamp(15px,1.1vw,24px)}
.tvhead{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(135deg,var(--court),var(--court-deep));color:var(--court-ink);border-radius:16px;padding:14px 22px}
.tvhead .logo{width:clamp(60px,6vw,110px);height:clamp(60px,6vw,110px)}
.tvtitle{min-width:0;flex:1}
.tvtitle h1{margin:4px 0 2px;font-size:clamp(28px,3.2vw,64px)}
.tvsub{opacity:.8}
.tvmeta{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tvclock{font-family:var(--display);font-weight:700;font-size:clamp(28px,2.8vw,56px);font-variant-numeric:tabular-nums;line-height:1}
.tvdots{display:flex;gap:6px}.tvdots span{font-size:.75em;padding:2px 10px;border-radius:999px;background:var(--band-soft);opacity:.7}.tvdots span.on{opacity:1;background:var(--surface);color:var(--ink);font-weight:600}
.tvbody{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,460px);gap:18px;align-items:start}
@media (max-width:900px){.tvbody{grid-template-columns:minmax(0,1fr)}}
.tvgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px;align-content:start}
#tv h2{font-size:1.7em;margin-bottom:6px}
#tv th{font-size:.72em}
#tv td{padding:.45em .5em}
#tv td.team{max-width:none;font-size:1.08em}
#tv td.rank{font-size:1.2em}
.tvside{display:flex;flex-direction:column;gap:18px;min-width:0}
.tvlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.tvlist li{padding:.55em 0;border-bottom:1px solid var(--line)}.tvlist li:last-child{border-bottom:0}
.tvlist small{display:block;font-size:.72em;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tvres{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.tvres span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.tvres span:last-child{text-align:right}
.tvres span.w{color:var(--win);font-weight:600}
.tvres b{font-variant-numeric:tabular-nums}.tvres b.vs{color:var(--muted);font-weight:400}
#tv .km{cursor:default}
#tv .round{min-width:0}
#tv .bracket .round:not(:last-child){flex:1.3}
#tv .thirdrow .round:not(:last-child){flex:1.3}
#tv .bracket,#tv .thirdrow{overflow:visible}

.stabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line);margin-bottom:-8px}
.stab{display:flex;gap:10px;align-items:center;background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 8px 12px;cursor:pointer;text-align:left;min-width:0;color:var(--muted)}
.stab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink)}
.stab .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:16px}
.stab[aria-selected="true"] .num{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.stx{display:flex;flex-direction:column;min-width:0}.stx b{font-weight:600}.stx small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.stx small{display:none}.stab{flex-direction:column;gap:4px;text-align:center}}
.fmtpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.fmt{position:relative;display:flex;flex-direction:column;gap:6px;border:2px solid var(--line);border-radius:12px;padding:14px 16px 16px;cursor:pointer;background:var(--surface);transition:border-color .15s,box-shadow .15s,transform .15s;font-weight:400}
.fmt:hover{border-color:var(--muted)}
.fmt input{position:absolute;opacity:0;pointer-events:none}
.fmt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.fmt:has(input:focus-visible){outline:2px solid var(--shuttle);outline-offset:3px}
.fmt .tick{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.fmt:has(input:checked) .tick{border-color:var(--accent);background:var(--accent)}
.fmt:has(input:checked) .tick::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.fmt-t{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.1}
.fmt .muted{font-size:13.5px}
.dg{width:100%;max-width:300px;height:auto;margin-bottom:4px}
.dg text{font-family:var(--display);font-weight:600;font-size:13px;fill:var(--ink);text-anchor:middle}
.dg text.sm{font-size:10.5px}.dg text.lbl{text-anchor:start;font-size:11.5px;fill:var(--muted)}.dg text.inv{fill:var(--surface);font-size:12px}
.dg-g{fill:var(--chip);stroke:var(--line);stroke-width:1.2}
.dg-l{fill:none;stroke:var(--muted);stroke-width:1.1;opacity:.55}
.dg-f{fill:var(--accent)}
.dg-b{fill:none;stroke-width:2}.dg-b.gold{stroke:var(--gold)}.dg-b.silver{stroke:var(--silver)}.dg-b.bronze{stroke:var(--bronze)}
.dg-m.gold{fill:var(--gold)}.dg-m.silver{fill:var(--silver)}.dg-m.bronze{fill:var(--bronze)}
.fmt:not(:has(input:checked)) .dg{opacity:.7}
@media (prefers-reduced-motion: no-preference){.fmt:has(input:checked) .dg-f,.fmt:has(input:checked) .dg-m{animation:pop .35s ease-out}}
@keyframes pop{from{transform:scale(.6);transform-origin:center;transform-box:fill-box}to{transform:scale(1);transform-box:fill-box}}

.gbox{display:flex;flex-direction:column;gap:6px;min-width:0;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.gbox textarea{display:block;max-width:100%}
.gbox textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
.fill{margin-top:16px;border:1px dashed var(--line);border-radius:8px;padding:10px 14px}
.fill summary{cursor:pointer;font-weight:600}
#fillList,#fillMode{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}

/* Dialogs */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(440px,calc(100vw - 32px));box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(40,20,10,.35)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.sgrid{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.sgrid .hd{font-weight:600;font-size:13.5px;text-align:center;overflow-wrap:anywhere;line-height:1.25}
.sgrid .gl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sgrid input{text-align:center;font-size:20px;font-family:var(--display);font-weight:600;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);width:100%;font-variant-numeric:tabular-nums}
.sgrid input.bad{border-color:var(--bad)}
.msg{min-height:22px;font-size:14px}
.msg.ok{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

/* ---------- Tournament construction ---------- */
function parseTeams(text){
  const names=[],manual=[],gNames=[];let hasHeads=false,cur=null;
  text.split(/\n/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
    const h=line.match(/^#?\s*group\s+(.+?):?$/i);
    if(h){hasHeads=true;cur=[];manual.push(cur);gNames.push(h[1].trim());return}
    names.push(line.replace(/^\d+[.)]\s*/,''));
    if(cur)cur.push(names.length-1);

  if(hasHeads){const loose=names.map((_,i)=>i).filter(i=>!manual.some(g=>g.includes(i)));if(loose.length){manual.unshift(loose);gNames.unshift('?')}}
  return{names,manual:hasHeads?manual.filter(g=>g.length):null,gNames:hasHeads?gNames.filter((_,i)=>manual[i].length):null};
}

  else{const G=Math.max(1,Math.min(cfg.numGroups,Math.floor(teams.length/2)||1));let order=teams.map((_,i)=>i);if(cfg.assign==='random')shuffle(order);gi=snake(teams.length,G,order);gn=gi.map((_,i)=>letter(i))}
  const st={v:1,name:cfg.name||'Badminton Tournament',format:cfg.format,advance:cfg.advance,tierCount:cfg.tierCount,rules:cfg.rules,
    teams,groups:gi.map((ids,i)=>({name:gn[i],teamIds:ids.map(x=>teams[x].id)})),matches:{},ko:null,example:false,third:cfg.third||{},assign:p.manual?'manual':cfg.assign,numGroups:gi.length};
  const per=st.groups.map(g=>roundRobin(g.teamIds));let order=0;const maxR=Math.max(0,...per.map(r=>r.length));
  for(let r=0;r<maxR;r++)st.groups.forEach((g,i)=>(per[i][r]||[]).forEach(([a,b])=>{const id=uid('m');st.matches[id]={id,stage:'group',group:i,round:r+1,a,b,games:[],order:++order}}));

}
function roundRobin(ids){const t=ids.slice();if(t.length%2)t.push(null);const n=t.length,rounds=[];

/* ---------- Standings ---------- */
const team=id=>S.teams.find(t=>t.id===id);
const tname=id=>id?(team(id)?.name??'?'):'';
const seedIdx=id=>S.teams.findIndex(t=>t.id===id);
function isVoid(m){return m.stage==='group'&&!!(team(m.a)?.withdrawn||team(m.b)?.withdrawn)}
const groupMatches=gi=>Object.values(S.matches).filter(m=>m.stage==='group'&&m.group===gi).sort((a,b)=>a.order-b.order);
const allGroupMatches=()=>Object.values(S.matches).filter(m=>m.stage==='group'&&!isVoid(m)).sort((a,b)=>a.order-b.order);
function h2h(gi,a,b){const m=groupMatches(gi).find(m=>(m.a===a&&m.b===b)||(m.a===b&&m.b===a));if(!m)return null;const r=result(m);return r.status==='done'?(r.winner===0?m.a:m.b):null}
function standings(gi){
  const rows=S.groups[gi].teamIds.filter(id=>!team(id)?.withdrawn).map(id=>({id,P:0,W:0,L:0,GW:0,GL:0,PF:0,PA:0}));
  const by=Object.fromEntries(rows.map(r=>[r.id,r]));
  groupMatches(gi).forEach(m=>{if(isVoid(m))return;const r=result(m);if(r.status!=='done')return;const A=by[m.a],B=by[m.b];if(!A||!B)return;

    A.GW+=r.wins[0];A.GL+=r.wins[1];B.GW+=r.wins[1];B.GL+=r.wins[0];A.PF+=r.pts[0];A.PA+=r.pts[1];B.PF+=r.pts[1];B.PA+=r.pts[0]});
  const key=r=>[r.W,r.GW-r.GL,r.PF-r.PA];

  let i=0;while(i<rows.length){let j=i+1;while(j<rows.length&&cmp(key(rows[i]),key(rows[j]))===0)j++;
    if(rows[i].P>0){if(j-i===2){const h=h2h(gi,rows[i].id,rows[i+1].id);if(h){if(h===rows[i+1].id)[rows[i],rows[i+1]]=[rows[i+1],rows[i]];rows[i].note=rows[i+1].note='H2H'}else rows[i].note=rows[i+1].note='tied'}
      else if(j-i>2)for(let k=i;k<j;k++)rows[k].note='tied'}

}

function bracketDefs(){

  const names=[['Gold','gold'],['Silver','silver'],['Bronze','bronze']],out=[];
  for(let k=0;k<Math.min(S.tierCount||3,3);k++){const from=k*2+1;if(from>max)break;out.push({name:names[k][0],key:names[k][1],from,to:Math.min(from+1,max)})}

  const rounds=[];let prev=[];
  for(let i=0;i<P;i+=2){const id=uid('k'),a=slots[i],b=slots[i+1];S.matches[id]={id,stage:'ko',a:a?{t:a.team,tag:a.tag}:null,b:b?{t:b.team,tag:b.tag}:null,games:[]};prev.push(id)}

  const ext=real.reduce((s,m)=>s+m.games.filter(g=>Math.max(...g)>rulesFor(m).pts).length,0);
  const wos=done.filter(m=>m.wo!=null).length,wd=S.teams.filter(t=>t.withdrawn).length,t=timingStats();
  const tile=(n,l)=>`<div class="tile"><b>${n}</b><span>${l}</span></div>`;
  const lbl=m=>m.stage==='group'?`Group ${esc(S.groups[m.group].name)} · Match ${m.order}`:`${esc(bracketOf(m))} · ${esc(m.code)}`;
  const vs=m=>`${esc(tname(sideTeam(m,0)))} v ${esc(tname(sideTeam(m,1)))}`;
  const rec=(title,m,val)=>m?`<li><small>${title}</small><span>${vs(m)}</span><span class="muted">${lbl(m)} · ${val}</span></li>`:'';
  const margin=m=>{const r=result(m);return Math.abs(r.pts[0]-r.pts[1])};
  const by=(arr,f,dir)=>arr.length?arr.reduce((a,b)=>dir*(f(b)-f(a))>0?b:a):null;
  const timed=real.filter(m=>m.duration);
  const recs=[rec('Longest match',by(timed,m=>m.duration,1),timed.length?durMin(by(timed,m=>m.duration,1))+' min':''),
    rec('Quickest match',by(timed,m=>m.duration,-1),timed.length?durMin(by(timed,m=>m.duration,-1))+' min':''),
    rec('Closest match',by(real,margin,-1),real.length?`${margin(by(real,margin,-1))} points apart · ${esc(scoreText(by(real,margin,-1),result(by(real,margin,-1))))}`:''),
    rec('Biggest win',by(real,margin,1),real.length?`${margin(by(real,margin,1))} points apart · ${esc(scoreText(by(real,margin,1),result(by(real,margin,1))))}`:'')].join('');
  const ps={};S.teams.forEach(tm=>ps[tm.id]={P:0,W:0,L:0,GW:0,GL:0,PF:0,PA:0,dur:0,dn:0});
  done.forEach(m=>{const A=sideTeam(m,0),B=sideTeam(m,1),r=result(m);if(!ps[A]||!ps[B])return;[[A,0],[B,1]].forEach(([id,i])=>{const p=ps[id];p.P++;r.winner===i?p.W++:p.L++;if(m.wo==null){p.GW+=r.wins[i];p.GL+=r.wins[1-i];p.PF+=r.pts[i];p.PA+=r.pts[1-i]}if(m.duration){p.dur+=m.duration;p.dn++}})});
  const gOf=id=>S.groups.find(g=>g.teamIds.includes(id));
  const rows=S.teams.map(tm=>({tm,...ps[tm.id]})).sort((a,b)=>b.W-a.W||(b.PF-b.PA)-(a.PF-a.PA)||a.L-b.L);
  return`<section class="tiles">${tile(`${done.length}<small>/${all.length}</small>`,'matches played')}${tile(games,'games played')}${tile(pts.toLocaleString('de-CH'),'points scored')}${tile(ext,`games past ${S.rules.group.pts} (deuce)`)}${tile(wos,'walkovers')}${tile(wd,'pairs withdrawn')}${tile(t.span?fmtHM(t.span):'–','running time')}</section>
  <div class="statgrid">${viewTiming()}<section class="card"><h2>Records</h2>${recs?`<ul class="tvlist recs">${recs}</ul>`:'<p class="muted">Records appear once matches have results.</p>'}</section></div>
  <section class="card"><h2>Pairs</h2><p class="muted" style="margin:4px 0 10px;font-size:13.5px">All matches so far, group stage and knockout together. Walkovers count as a win or loss but add no games or points.</p>
  <div class="tablewrap"><table><thead><tr><th class="l">Pair</th><th class="l">Group</th><th>Played</th><th>Won</th><th>Lost</th><th>Games</th><th>Points</th><th>Pts ±</th><th>Avg time</th></tr></thead><tbody>
  ${rows.map(r=>{const pd=r.PF-r.PA;return`<tr class="${r.tm.withdrawn?'wd':''}"><td class="l team">${esc(r.tm.name)}${r.tm.withdrawn?'<span class="note">withdrawn</span>':''}</td><td class="l">${esc(gOf(r.tm.id)?.name||'')}</td><td>${r.P}</td><td><b>${r.W}</b></td><td>${r.L}</td><td>${r.GW}–${r.GL}</td><td>${r.PF}–${r.PA}</td><td>${pd>0?'+':''}${pd}</td><td>${r.dn?Math.round(r.dur/r.dn/60000)+' min':'–'}</td></tr>`}).join('')}
  </tbody></table></div></section>`;
}
/* ---------- Score sheets PDF ---------- */
function fitText(doc,t,maxW,fs,bold){doc.setFont('helvetica',bold?'bold':'normal');let s=fs;doc.setFontSize(s);
  while(doc.getTextWidth(t)>maxW&&s>11){s-=0.5;doc.setFontSize(s)}
  if(doc.getTextWidth(t)>maxW){while(t.length>1&&doc.getTextWidth(t+'...')>maxW)t=t.slice(0,-1);t+='...'}return t}
function buildPDF(gsel){
  const{jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const bo=S.rules.group.bo,cols=bo===1?['Score']:['Set 1','Set 2','Set 3'];
  const ms=allGroupMatches().filter(m=>gsel==='all'||m.group===+gsel);
  const W=297,M=10,GAPX=12,colW=(W-2*M-GAPX)/2,setW=bo===1?40:22,nameW=colW-setW*cols.length;
  const rowH=9.6,metaH=4.4,top=20,avail=200-top,slipH=metaH+3*rowH,gapY=(avail-5*slipH)/4;
  const per=10,n=Math.max(1,Math.ceil(ms.length/per));
  for(let p=0;p<n;p++){
    if(p)doc.addPage();
    doc.setTextColor(0);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Indo-Swiss Sports Club',M,14);
    doc.setFont('helvetica','normal');doc.text(S.name,W/2,14,{align:'center'});doc.text(`Page ${p+1} of ${n}`,W-M,14,{align:'right'});
    doc.setLineWidth(.4);doc.setDrawColor(0);doc.line(M,16,W-M,16);
    for(let i=0;i<per;i++){const m=ms[p*per+i];if(!m)break;
      const x=M+(i%2)*(colW+GAPX),y=top+Math.floor(i/2)*(slipH+gapY),ty=y+metaH;
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(90);doc.text(`Match ${m.order} - Round ${m.round}`,x,y+3);doc.setTextColor(0);
      doc.setFillColor(217,217,217);doc.rect(x,ty,colW,rowH,'F');
      doc.setLineWidth(.35);doc.rect(x,ty,colW,3*rowH,'S');
      doc.line(x,ty+rowH,x+colW,ty+rowH);doc.line(x,ty+2*rowH,x+colW,ty+2*rowH);
      for(let k=0;k<cols.length;k++){const cx=x+nameW+k*setW;doc.line(cx,ty,cx,ty+3*rowH)}
      const mid=r=>ty+r*rowH+rowH/2;
      doc.text(fitText(doc,'GROUP '+String(S.groups[m.group].name).toUpperCase(),nameW-5,18,true),x+2.5,mid(0),{baseline:'middle'});
      cols.forEach((c,k)=>doc.text(fitText(doc,c,setW-4,18,true),x+nameW+k*setW+2,mid(0),{baseline:'middle'}));
      [m.a,m.b].forEach((id,r)=>doc.text(fitText(doc,tname(id),nameW-5,18,false),x+2.5,mid(r+1),{baseline:'middle'}));
    }
    const cnt=Math.min(per,ms.length-p*per),rows=Math.ceil(cnt/2);
    if(cnt>0){doc.setDrawColor(150);doc.setLineWidth(.25);doc.setLineDashPattern([2.5,1.8],0);
      for(let r=0;r<rows-1;r++){const cy=top+(r+1)*(slipH+gapY)-gapY/2;doc.line(M-4,cy,W-M+4,cy)}
      if(cnt>1){const cx=M+colW+GAPX/2;doc.line(cx,top-1.5,cx,top+rows*slipH+(rows-1)*gapY+1.5)}
      doc.setLineDashPattern([],0);doc.setDrawColor(0)}
  }
  return{doc,count:ms.length,pages:n};
}
async function downloadSheets(){
  const msg=$('#pdfMsg'),gsel=$('#pdfGroup').value;
  if(!window.jspdf){msg.textContent='The PDF maker could not load. Check the internet connection and reload.';return}
  const{doc,count,pages}=buildPDF(gsel);
  const gname=gsel==='all'?'':` Group ${S.groups[+gsel].name}`;
  const fname=`${S.name}${gname} score sheets.pdf`.replace(/[\\/:*?"<>|]+/g,'-');
  msg.textContent='Preparing PDF...';
  let dl=null;try{if(window.claude&&claude.use)dl=await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:fname,data:doc.output('blob')});msg.textContent=`Saved ${count} sheets on ${pages} page${pages>1?'s':''}`}
    catch(e){msg.textContent=e&&e.code==='declined'?'Download cancelled':'The download did not work here. Try the HTML file in your browser.'}return}
  try{doc.save(fname);msg.textContent=`Downloaded ${count} sheets on ${pages} page${pages>1?'s':''}`}catch(e){msg.textContent='The download did not work here.'}
}
/* ---------- Player display (#display) ---------- */
const DISPLAY_URL='https://claude.ai/artifact/1hUM975N9r5hjXxuCG2gnP#display';
const isTV=()=>location.hash.startsWith('#display');
const tvMode=()=>location.hash==='#display-groups'?'groups':location.hash==='#display-ko'?'ko':'auto';
let tvScreen=0,tvRotate=null,tvClock=null,wake=null;
function tvKO(){return S.ko?Object.values(S.matches).filter(m=>m.stage==='ko'):[]}
function tvLabel(m){return m.stage==='group'?`Group ${S.groups[m.group].name} · R${m.round}`:`${bracketOf(m)} · ${m.code}`}
function renderTV(){
  document.querySelector('header.band').hidden=true;main.hidden=true;const tv=$('#tv');tv.hidden=false;document.body.classList.add('tvmode');
  const gp0=groupProgress(),gDone=gp0.total>0&&gp0.done===gp0.total;const md=tvMode();const screens=md==='groups'?['groups']:md==='ko'?['ko']:S.ko?(gDone?['ko']:['groups','ko']):['groups'];if(tvScreen>=screens.length)tvScreen=0;const scr=screens[tvScreen];
  const p=groupProgress();
  const doneMs=[...allGroupMatches(),...tvKO()].filter(m=>!isBye(m)&&result(m).status==='done').sort((a,b)=>(b.at||0)-(a.at||0)||(b.order||0)-(a.order||0)).slice(0,6);
  let next=allGroupMatches().filter(m=>result(m).status!=='done'&&!onCourt(m));
  if(!next.length)next=tvKO().filter(m=>!isBye(m)&&sideTeam(m,0)&&sideTeam(m,1)&&result(m).status!=='done'&&!onCourt(m));
  next=next.slice(0,5);
  const live=[...allGroupMatches(),...tvKO()].filter(m=>!isBye(m)&&result(m).status==='live');
  const res=m=>{const r=result(m),A=sideTeam(m,0),B=sideTeam(m,1);return`<li><small>${esc(tvLabel(m))}${m.duration?` · ${durMin(m)} min`:''}</small><div class="tvres"><span class="${r.winner===0?'w':''}">${esc(tname(A))}</span><b>${r.wo?'W/O':esc(m.games.map(g=>g.join('–')).join(', '))}</b><span class="${r.winner===1?'w':''}">${esc(tname(B))}</span></div></li>`};
  const nx=m=>`<li><small>${m.order?'Match '+m.order+' · ':''}${esc(tvLabel(m))}</small><div class="tvres"><span>${esc(tname(sideTeam(m,0)))}</span><b class="vs">vs</b><span>${esc(tname(sideTeam(m,1)))}</span></div></li>`;
  const logo=$('header .logo').src;
  const side=`<aside class="tvside">
      <section class="card"><h3>On court</h3><ul class="tvlist">${Array.from({length:nCourts()},(_,i)=>{const m=courtMatch(i+1);if(!m)return`<li><small>Court ${i+1}</small><div class="muted">Free</div></li>`;const r=result(m);return`<li><small>Court ${i+1} · ${esc(tvLabel(m))} · <span data-since="${m.started||''}">${mins(m.started)} min</span></small><div class="tvres"><span>${esc(tname(sideTeam(m,0)))}</span><b>${r.status==='live'?r.wins[0]+'–'+r.wins[1]:'vs'}</b><span>${esc(tname(sideTeam(m,1)))}</span></div></li>`}).join('')}</ul></section>
      <section class="card"><h3>Up next</h3>${next.length?`<ul class="tvlist">${next.map(nx).join('')}</ul>`:'<p class="muted">No matches waiting.</p>'}</section>
      <section class="card"><h3>Latest results</h3>${doneMs.length?`<ul class="tvlist">${doneMs.map(res).join('')}</ul>`:'<p class="muted">No results yet.</p>'}</section>
      </aside>`;
  let body;
  if(scr==='groups'){
    body=`<div class="tvbody"><div class="tvgroups">${S.groups.map((g,gi)=>{const rows=standings(gi);
      return`<section class="card"><h2>Group ${esc(g.name)}</h2><div class="tablewrap"><table><thead><tr><th class="l">#</th><th class="l">Pair</th><th>P</th><th>W</th><th>L</th><th>Games ±</th><th>Pts ±</th></tr></thead><tbody>
      ${rows.map((r,i)=>{const gd=r.GW-r.GL,pd=r.PF-r.PA;return`<tr class="q-${tierOf(i+1)}"><td class="rank">${i+1}</td><td class="l team">${esc(tname(r.id))}${r.note?`<span class="note">${r.note}</span>`:''}</td><td>${r.P}</td><td><b>${r.W}</b></td><td>${r.L}</td><td>${gd>0?'+':''}${gd}</td><td>${pd>0?'+':''}${pd}</td></tr>`}).join('')}</tbody></table></div></section>`}).join('')}
      <div class="legend">${bracketDefs().map(d=>`<span><i style="background:var(--${d.key==='main'?'accent':d.key})"></i>${d.key==='main'?'Advances to knockout':esc(d.name)} (rank ${d.from}${d.to>d.from?'–'+d.to:''})</span>`).join('')}</div></div>
      ${side}</div>`;
  }else{
    body=!S.ko?`<div class="tvbody"><section class="card"><h2>Knockout</h2><p class="muted" style="font-size:1.1em">The knockout draw has not been made yet. Results appear here once the knockout starts.</p></section>${side}</div>`:`<div class="tvbody"><div class="tvko">${S.ko.brackets.map(b=>{const champ=winnerTeam(S.matches[b.rounds[b.rounds.length-1][0]]);
      return`<section class="card bracket-card ${b.key}"><div class="row spread"><h2>${esc(b.name)}${b.key!=='main'?' bracket':''}</h2>${podium(S.matches[b.rounds[b.rounds.length-1][0]],b)}</div>
      <div class="bracket">${b.rounds.map(r=>`<div class="round"><h3>${esc(S.matches[r[0]].round)}</h3><div class="rmatches">${r.map(id=>`<div class="slot">${koCard(S.matches[id],true)}</div>`).join('')}</div></div>`).join('')}</div>${thirdRow(b,true)}</section>`}).join('')}</div>${side}</div>`;
  }
  tv.innerHTML=`<div class="tvhead"><img class="logo" src="${logo}" alt="Indo-Swiss Sports Club logo"><div class="tvtitle"><div class="clubname">Indo-Swiss Sports Club</div><h1>${esc(S.name)}</h1>
    <div class="tvsub">${scr==='groups'?`Group stage · ${p.done} of ${p.total} matches played`:'Knockout'}${S.example?' · <span class="tag">Example data</span>':''}</div></div>
    <div class="tvmeta"><div class="tvclock" id="tvClock"></div>${screens.length>1?`<div class="tvdots">${screens.map((s,i)=>`<span class="${i===tvScreen?'on':''}">${s==='groups'?'Groups':'Knockout'}</span>`).join('')}</div>`:''}
    <button class="btn" id="fsBtn" type="button">Full screen</button></div></div>${body}`;
  tickClock();fitTV();
  $('#fsBtn').hidden=!!document.fullscreenElement;
  $('#fsBtn').onclick=()=>{try{const r=document.documentElement.requestFullscreen?.();r&&r.catch(()=>{})}catch(e){}};
  if(!tvRotate)tvRotate=setInterval(()=>{const fresh=load();if(fresh&&fresh.teams)S=fresh;tvScreen++;renderTV()},20000);
  if(!tvClock)tvClock=setInterval(tickClock,15000);
  keepAwake();
}
function fitTV(){const body=document.querySelector('#tv .tvbody');if(!body)return;
  const main=body.firstElementChild,side=body.querySelector('.tvside');if(!main)return;
  main.style.zoom='1';main.style.gridTemplateColumns='';if(side){side.style.maxHeight='';}
  const foot=document.querySelector('.sitefoot'),fh=foot?foot.offsetHeight:0;
  const avail=window.innerHeight-body.getBoundingClientRect().top-fh-24;if(avail<120)return;
  if(side)side.style.maxHeight=avail+'px';
  const W=main.getBoundingClientRect().width;
  if(main.classList.contains('tvko')){const n=main.children.length;let best={c:1,z:0};
    for(let c=1;c<=n;c++){main.style.zoom='1';main.style.gridTemplateColumns=`repeat(${c},minmax(0,1fr))`;const H=main.getBoundingClientRect().height;
      const z=Math.min(1,avail/H,(W/c)/660);if(z>best.z+0.01)best={c,z}}
    main.style.gridTemplateColumns=`repeat(${best.c},minmax(0,1fr))`;main.dataset.z=best.z}
  let z=main.classList.contains('tvko')?Math.min(1,+main.dataset.z||1):1;main.style.zoom=z.toFixed(3);
  for(let i=0;i<5;i++){const h=main.getBoundingClientRect().height;if(h<=avail+1)break;z=Math.max(.3,z*avail/h);main.style.zoom=z.toFixed(3)}}
window.addEventListener('resize',()=>{if(isTV())fitTV()});
document.addEventListener('fullscreenchange',()=>{if(isTV())setTimeout(fitTV,120)});
try{document.fonts&&document.fonts.ready.then(()=>{if(isTV())fitTV()})}catch(e){}
function tickClock(){const c=$('#tvClock');if(c)c.textContent=new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})}
async function keepAwake(){try{if(!wake&&navigator.wakeLock&&document.visibilityState==='visible'){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}}
function leaveTV(){clearInterval(tvRotate);clearInterval(tvClock);tvRotate=tvClock=null;$('#tv').hidden=true;document.querySelector('header.band').hidden=false;main.hidden=false;document.body.classList.remove('tvmode')}
window.addEventListener('hashchange',()=>{if(isTV())renderTV();else{leaveTV();render()}});
window.addEventListener('storage',e=>{if(e.key!==KEY)return;const fresh=load();if(!fresh||!fresh.teams)return;S=fresh;if(isTV())renderTV();else if(!$('#dlg').open&&!$('#cdlg').open&&tab!=='setup')render()});
document.addEventListener('fullscreenchange',()=>{const b=$('#fsBtn');if(b)b.hidden=!!document.fullscreenElement});
document.addEventListener('visibilitychange',()=>{if(isTV())keepAwake()});
try{if(location.protocol==='file:')$('.tvlink').href=location.href.split('#')[0]+'#display'}catch(e){}
render();
